<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-20 flex gap-12">
  <!-- Check-in tooltip -->
  <div class="relative inline-block">
    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 z-30 whitespace-nowrap flex flex-col items-center">
      <div class="bg-white text-[#222222] text-[13px] font-normal px-2.5 py-1 rounded-md shadow-[0_2px_8px_rgba(0,0,0,0.12)] border border-[#e4e4e4]">
        Check-in day
      </div>
      <div className="-mt-[5px] w-2 h-2 bg-white border-r border-b border-[#e4e4e4] rotate-45" style="margin-top: -5px; width: 8px; height: 8px; background: white; border-right: 1px solid #e4e4e4; border-bottom: 1px solid #e4e4e4; transform: rotate(45deg);"></div>
    </div>
    <div class="w-10 h-10 bg-black text-white font-semibold rounded-full flex items-center justify-center ring-2 ring-black ring-offset-2 ring-offset-white">
      27
    </div>
  </div>

  <!-- Checkout tooltip -->
  <div class="relative inline-block">
    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 z-30 whitespace-nowrap flex flex-col items-center">
      <div class="bg-white text-[#222222] text-[13px] font-normal px-2.5 py-1 rounded-md shadow-[0_2px_8px_rgba(0,0,0,0.12)] border border-[#e4e4e4]">
        Checkout day
      </div>
      <div style="margin-top: -5px; width: 8px; height: 8px; background: white; border-right: 1px solid #e4e4e4; border-bottom: 1px solid #e4e4e4; transform: rotate(45deg);"></div>
    </div>
    <div class="w-10 h-10 bg-black text-white font-semibold rounded-full flex items-center justify-center ring-2 ring-black ring-offset-2 ring-offset-white">
      28
    </div>
  </div>
</body>
</html>
